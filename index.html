    <!-- Synchronous dynamic canonical tag to always match active origin and path -->
    <script>
      (function() {
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = window.location.origin + window.location.pathname;
        document.head.appendChild(link);
      })();
    </script>

    <!-- Open Graph / Facebook -->
